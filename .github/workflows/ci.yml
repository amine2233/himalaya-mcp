name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: amine2233/ci-shared/.github/workflows/ci.yml@1.2
    with:
      macos-runner: "macos-26"
      # ubuntu-latest (26.04) dropped libxml2.so.2, which the executor Linux binary needs.
      linux-runner: "ubuntu-24.04"
      enable-macos: true
      enable-linux: true
      enable-lint: true
      enable-coverage: false
      enable-title-check: true
